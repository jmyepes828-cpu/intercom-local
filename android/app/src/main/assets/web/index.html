<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Intercom Local</title>
<meta name="theme-color" content="#14181a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Intercom">
<style>
/* Radio de campo: panel oscuro, un botón grande, estado en una pantalla tipo LCD. */
:root{
  --bg:#14181a; --panel:#1d2326; --line:#2c3437; --fg:#e7ece9; --dim:#8e9a96;
  --accent:#f2a531; --ok:#4fc47f; --bad:#e5594f; --lcd:#0e1412; --lcdfg:#9fe0b4;
  --sans:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans);
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;padding-block:16px}
header{display:flex;align-items:center;justify-content:space-between}
h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0;font-weight:700}
h1 b{color:var(--accent)}
.lcd{background:var(--lcd);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:var(--mono);color:var(--lcdfg);font-size:13px;display:grid;gap:4px}
.row{display:flex;justify-content:space-between;gap:12px}
.k{color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.led{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--dim);margin-right:6px;vertical-align:middle}
.led.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)} .led.bad{background:var(--bad)} .led.wait{background:var(--accent)}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-weight:600;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:#1a1405;border-color:var(--accent)}
.talk{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:320px}
.ptt{width:min(68vw,250px);aspect-ratio:1/1;max-width:100%;border-radius:50%;border:2px solid var(--line);
  background:radial-gradient(circle at 50% 40%,#2a3236,#171c1e);color:var(--fg);font-size:17px;letter-spacing:.1em;text-transform:uppercase;
  touch-action:none;transition:transform .08s,box-shadow .15s,border-color .15s}
.ptt.on{border-color:var(--accent);box-shadow:0 0 0 8px rgba(242,165,49,.18),0 0 40px rgba(242,165,49,.35);transform:scale(.97);color:var(--accent)}
.mode{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.mode button{border:0;background:transparent;padding:9px 14px;font-size:13px;border-radius:8px}
.mode button[aria-pressed="true"]{background:var(--line);color:var(--accent)}
.rx{font-family:var(--mono);font-size:13px;color:var(--dim);min-height:1.4em}
.rx.on{color:var(--ok)}
.note{font-size:12px;color:var(--dim);text-align:center;margin:0}
.cover{position:fixed;inset:0;background:rgba(10,13,14,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));text-align:center;z-index:5}
.cover button{font-size:18px;padding:18px 28px}
.cover p{color:var(--dim);margin:0;max-width:34ch}
.err{color:var(--bad)}
@media (prefers-reduced-motion:reduce){.ptt{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Intercom <b>Local</b></h1>
    <span id="wl" class="k"></span>
  </header>

  <div class="lcd" aria-live="polite">
    <div class="row"><span class="k">Enlace</span><span><span id="led" class="led"></span><span id="st">Sin conectar</span></span></div>
    <div class="row"><span class="k">Servidor</span><span id="srv">—</span></div>
  </div>

  <section class="talk">
    <div class="mode" role="group" aria-label="Modo">
      <button id="mPtt" aria-pressed="true">Pulsar para hablar</button>
      <button id="mOpen" aria-pressed="false">Manos libres</button>
    </div>
    <button class="ptt" id="ptt">Mantén<br>para hablar</button>
    <div class="rx" id="rx">—</div>
    <p class="note">Se reconecta sola si sales de Safari y vuelves. Para dejarla fija: Bloqueo automático en “Nunca” y Acceso guiado.</p>
  </section>
</div>

<div class="cover" id="cover">
  <h1>Intercom <b>Local</b></h1>
  <button class="primary" id="bStart">Toca para conectar</button>
  <p id="coverMsg">Usa audífonos para evitar eco. La primera vez Safari pedirá permiso para el micrófono.</p>
</div>

<script src="app.js"></script>
</body>
</html>
